apiVersion: v1
kind: Secret
metadata:
  name: cyro-dev-postgres-secret
  namespace: cyro-dev
type: Opaque
stringData:
  POSTGRES_USER: gg_admin
  POSTGRES_DB: gophergate
  POSTGRES_PASSWORD: devpassword
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cyro-dev-postgres-data
  namespace: cyro-dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyro-dev-postgres
  namespace: cyro-dev
  labels:
    app.kubernetes.io/name: cyro-dev-postgres
    app.kubernetes.io/part-of: cyro-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cyro-dev-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyro-dev-postgres
        app.kubernetes.io/part-of: cyro-dev
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cyro-dev-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cyro-dev-postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cyro-dev-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 15
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cyro-dev-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: cyro-dev-postgres
  namespace: cyro-dev
  labels:
    app.kubernetes.io/name: cyro-dev-postgres
    app.kubernetes.io/part-of: cyro-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cyro-dev-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres