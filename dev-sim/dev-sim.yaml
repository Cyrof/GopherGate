services:
  wireguard-dev:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard-dev
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Singapore
      - SERVERURL=127.0.0.1     
      - SERVERPORT=51820
      - PEERS=devpeer           
      - PEERDNS=auto
      - LOG_CONFS=true
    volumes:
      - ./wireguard/config:/config
      - /dev/net/tun:/dev/net/run
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: gg-postgres-dev
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - ./dev/db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15