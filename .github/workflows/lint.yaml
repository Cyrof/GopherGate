name: Lint

on: 
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find modules
        id: mods
        run: |
          mods=$(git ls-files '**/go.mod' | sed 's#/go.mod##' | jq -R . | jq -s .)
          echo "list=$mods" >> $GITHUB_OUTPUT

      - name: Lint each module
        uses: actions/github-script@v7
        with:
          scrip: |
            const mods = JSON.parse(process.env.MODS);
            core.info(`Modules: ${mods.join(', ')}`);
        env:
          MODS: ${{ steps.mods.outputs.list }}

  lint-module:
    needs: golangci-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.golangci-lint.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ matrix.module }}
          version: v1.59.1
          args: ./... --timeout=5m
