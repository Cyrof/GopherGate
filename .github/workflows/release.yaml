name: release
on:
  pull_request:
    branches: [dev]
    types: [closed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.chk.outputs.ok }}
    steps:
      - id: chk
        shell: bash
        run: |
          # Manual trigger always allowed
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then 
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.merged }}" != "true" ]; then 
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "${{ github.event.pull_request.base.ref }}" = "dev" && "${{ github.event.pull_request.head.ref }}" == release/* ]]; then
              echo "This was a release/* PR merged to dev; skipping downstream release."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=false" >> "$GITHUB_OUTPUT"

  core:
    needs: guard
    if: ${{ needs.guard.outputs.ok == 'true' }}
    uses: ./.github/workflows/_release-one.yaml
    with:
      module_path: gophergate-core
      module_label: gophergate-core
      dry_run: false
    secrets: inherit

