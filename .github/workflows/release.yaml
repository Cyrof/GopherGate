name: release
on:
  pull_request:
    branches: [dev]
    types: [closed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.chk.outputs.ok }}
    steps:
      - id: chk
        shell: bash
        run: |
          # Manual trigger always allowed
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then 
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.merged }}" != "true" ]; then 
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "${{ github.event.pull_request.base.ref }}" = "dev" && "${{ github.event.pull_request.head.ref }}" == release/* ]]; then
              echo "This was a release/* PR merged to dev; skipping downstream release."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=false" >> "$GITHUB_OUTPUT"

  detect-changes:
    needs: guard
    if: ${{ needs.guard.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      has_changes: ${{ steps.mk.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set diff range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
            echo "ref=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v3
        id: pf
        with:
          base: ${{ steps.range.outputs.base }}
          ref: ${{ steps.range.outputs.ref }}
          filters: |
            core:
              - 'gophergate-core/**'
            wg_agent:
              - 'gophergate-wg-agent/**'
            wg_ui:
              - 'gophergate-ui/**'

      - id: mk
        shell: bash
        run: |
          entries=()
          [ "${{ steps.pf.outputs.core }}" = "true" ] && entries+=('{"module_path":"gophergate-core","module_label":"gophergate-core"}')
          [ "${{ steps.pf.outputs.wg_agent }}" = "true" ] && entries+=('{"module_path":"gophergate-wg-agent","module_label":"gophergate-wg-agent"}')
          [ "${{ steps.pf.outputs.wg_ui }}" = "true" ] && entries+=('{"module_path":"gophergate-ui","module_label":"gophergate-ui"}')

          if [ ${#entries[@]} -eq 0 ]; then 
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else 
            printf 'matrix={"include":[%s]}\n' "$(IFS=,; echo "${entries[*]}")" >> "$GITHUB_OUTPUT"
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi

  release-modules:
    needs: [guard, detect-changes]
    if: ${{ needs.guard.outputs.ok == 'true' && needs.detect-changes.outputs.has_changes == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/_release-one.yaml
    with:
      module_path: ${{ matrix.module_path }}
      module_label: ${{ matrix.module_label }}
      dry_run: false
    secrets: inherit
