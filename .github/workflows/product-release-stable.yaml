name: Product Release (stable)

on:
  push:
    branches: ["stable"]

permissions:
  contents: write

jobs:
  product-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse product version from root CHANGELOG.md
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          FILE="CHANGELOG.md"
          if [ ! -f "$FILE" ]; then
            echo "Root CHANGELOG.md not found" >&2
            exit 1
          fi

          VERSION="$(grep -m1 -E '^## \[v?[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' "$FILE" \
            | sed -E 's/^## \[([^]]+)\].*/\1/')"

          if [ -z "$VERSION" ]; then
            echo "Could not parse version from $FILE." >&2
            echo "Expected heading like: ## [vX.Y.Z] - YYYY-MM-DD" >&2
            exit 1
          fi

          if [[ "$VERSION" != v* ]]; then VERSION="v$VERSION"; fi
          TAG="gophergate/$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if product tag already exists (idempotent)
        id: tagcheck
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if already released
        if: steps.tagcheck.outputs.exists == 'true'
        run: echo "Tag ${{ steps.ver.outputs.tag }} already exists. Skipping release."

      - name: Extract release notes from root CHANGELOG + append static footer
        if: steps.tagcheck.outputs.exists != 'true'
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.ver.outputs.version }}"
          FILE="CHANGELOG.md"

          NOTES="$(awk -v ver="## [${VERSION}]" '
            $0 ~ "^## \\[" { in_section=0 }
            index($0, ver) == 1 { in_section=1; next }
            in_section { print }
          ' "$FILE" | sed -e '1{/^$/d}')"

          if [ -z "$NOTES" ]; then
            echo "No changelog content found under ${VERSION} in ${FILE}" >&2
            exit 1
          fi

          FOOTER="$(cat <<'EOF'

---

## Distribution

### Docker Images
Container images are published to Docker Hub:

- **[gophergate](https://hub.docker.com/r/cyrof/gophergate)**

Component image tags:
- `cyrof/gophergate:gophergate-ui-<tag>`
- `cyrof/gophergate:gophergate-wg-agent-<tag>`

> Replace `<tag>` with the desired image tag (e.g. `latest` or a versioned tag).

### Deployment (Helm Chart)
The official Helm chart for deploying GopherGate is maintained here:

- **[GopherGate Helm Chart](https://github.com/Cyrof/CyroStack/tree/main/gophergate-deploy/gophergate)**
EOF
)"

          BODY="${NOTES}${FOOTER}"

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create annotated product tag on stable commit
        if: steps.tagcheck.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          git tag -a "$TAG" -m "Product release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
